name: Manual Board Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Используем современный Docker-контейнер, где уже есть всё для сборки
    container: ghcr.io/ardupilot/ardupilot-dev-base:ubuntu22
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build Rover Firmware
        run: |
          # Разрешаем git работать в контейнере
          git config --global --add safe.directory /__w/ardupilot/ardupilot
          # Собираем прошивку напрямую без установки каких-либо пакетов
          ./waf configure --board SpeedyBeeF405WING
          ./waf rover

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyBeeF405WING-Rover
          path: build/SpeedyBeeF405WING/bin/ardupilot.apj
