name: Manual Board Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install ARM GCC Compiler and Dependencies
        run: |
          sudo apt update
          # Устанавливаем только легкие пакеты сборки без скриптов ArduPilot
          sudo apt install -y gcc-arm-none-eabi lines spec g++ gawk git make wget python3-pip python3-setuptools python3-serial python3-empy
          pip3 install pymavlink matrix-multiplication dronecan
          
      - name: Build Rover Firmware
        run: |
          ./waf configure --board SpeedyBeeF405WING
          ./waf rover

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyBeeF405WING-Rover
          path: build/SpeedyBeeF405WING/bin/ardupilot.apj
