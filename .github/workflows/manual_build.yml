name: Manual Board Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Compiler and Dependencies
        run: |
          sudo apt update
          # Ставим компилятор и базовый софт напрямую из Ubuntu
          sudo apt install -y gcc-arm-none-eabi g++ gawk git make wget python3 python3-pip python3-setuptools python3-serial
          # Ставим строго ту версию EmPy, под которую написан Waf в ArduPilot
          pip3 install --upgrade pip
          pip3 install pymavlink dronecan empy==3.3.4 pexpect pyyaml

      - name: Build Rover Firmware
        run: |
          # Конфигурируем и сразу собираем в один шаг
          ./waf configure --board SpeedyBeeF405WING
          ./waf rover

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyBeeF405WING-Rover
          path: build/SpeedyBeeF405WING/bin/ardupilot.apj
