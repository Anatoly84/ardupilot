name: Manual Board Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Official ArduPilot Compiler (No Graphics)
        run: |
          sudo apt update
          export SKIP_AP_GRAPHICS=1
          export HEADLESS=1
          ./Tools/environment_install/install-prereqs-ubuntu.sh -y
          
      - name: Build Rover Firmware via Shortcut Script
        run: |
          # Используем официальный автоматический скрипт сборки в обход ручного waf
          export SKIP_AP_GRAPHICS=1
          export HEADLESS=1
          ./Tools/scripts/build_bootloaders.py SpeedyBeeF405WING || true
          ./Tools/scripts/build_binaries.py -v rover SpeedyBeeF405WING

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyBeeF405WING-Rover
          path: build/SpeedyBeeF405WING/bin/ardupilot.apj
