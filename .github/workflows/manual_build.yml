name: Manual Board Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Official ArduPilot Compiler (No Graphics)
        run: |
          sudo apt update
          export SKIP_AP_GRAPHICS=1
          export HEADLESS=1
          ./Tools/environment_install/install-prereqs-ubuntu.sh -y
          
      - name: Configure Firmware Board
        # Передаем явный путь к компилятору через переменную среды для этого конкретного шага
        env:
          PATH: /home/runner/opt/gcc-arm-none-eabi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          ./waf clean
          ./waf configure --board SpeedyBeeF405WING
          
      - name: Build Rover Firmware
        env:
          PATH: /home/runner/opt/gcc-arm-none-eabi/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          ./waf rover
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyBeeF405WING-Rover
          path: build/SpeedyBeeF405WING/bin/ardupilot.apj
